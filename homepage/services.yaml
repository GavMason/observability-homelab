---
- Monitoring:
    - Grafana:
        icon: grafana.png
        href: http://grafana.homelab.internal/
        description: Dashboards & Visualization
        siteMonitor: http://grafana:3000/api/health
        server: my-docker
        container: grafana
        widget:
          type: grafana
          url: http://grafana:3000
          username: "{{HOMEPAGE_VAR_GF_USER}}"
          password: "{{HOMEPAGE_VAR_GF_PASS}}"
          version: 2
          fields: ["dashboards", "alertstriggered"]
    - Prometheus:
        icon: prometheus.png
        href: http://prometheus.homelab.internal/
        description: Metrics Collection & Storage
        siteMonitor: http://prometheus:9090/-/healthy
        server: my-docker
        container: prometheus
        widget:
          type: prometheus
          url: http://prometheus:9090
    - Alertmanager:
        icon: alertmanager.png
        href: http://alertmanager.homelab.internal/
        description: Alert Routing & Notifications
        siteMonitor: http://alertmanager:9093/-/healthy
        server: my-docker
        container: alertmanager
    - Loki:
        icon: loki.png
        href: http://grafana.homelab.internal/explore
        description: Log Aggregation
        siteMonitor: http://loki:3100/ready
        server: my-docker
        container: loki

- Infrastructure:
    - Caddy:
        icon: caddy.png
        href: http://homelab.internal/
        description: Reverse Proxy
        server: my-docker
        container: caddy
        widget:
          type: caddy
          url: http://caddy:2019
    - cAdvisor:
        icon: cadvisor.png
        href: http://cadvisor.homelab.internal/
        description: Container Metrics
        siteMonitor: http://cadvisor:8080/healthz
        server: my-docker
        container: cadvisor
    - Uptime Kuma:
        icon: uptime-kuma.png
        href: http://uptime-kuma.homelab.internal/
        description: Uptime Monitoring
        siteMonitor: http://uptime-kuma:3001
        server: my-docker
        container: uptime-kuma
    - Portainer:
        icon: portainer.png
        href: http://portainer.homelab.internal/
        description: Container Management
        siteMonitor: http://192.168.1.150:9000
        server: my-docker
        container: portainer

- Networking:
    - Alertmanager Discord:
        icon: discord.png
        href: "#"
        description: Discord Alert Bridge
        server: my-docker
        container: alertmanager-discord
    - Promtail:
        icon: loki.png
        href: http://grafana.homelab.internal/explore
        description: Log Collector
        server: my-docker
        container: promtail
